[project]
name = "radpair"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian Quintes", email = "florian.quintes@pc.uni-freiburg.de" }
]
requires-python = ">=3.13"
dependencies = [
    "eprbase>=0.1.1",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[tool.sphinx]
source_dir = "docs"
build_dir = "docs/_build"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]
